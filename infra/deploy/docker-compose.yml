# =================================================================
#  Souqi Deploy — the platform stack
#  -----------------------------------------------------------------
#  Four services, and the security boundary runs between them:
#
#    postgres  platform data. Not reachable from user containers.
#    caddy     the ONLY service with published ports (80/443).
#    api       accepts requests, writes rows, never runs Docker.
#    worker    the only service with the Docker socket.
#
#  Two networks, and the separation is the point:
#
#    souqi_platform  postgres + api + worker + caddy
#    souqi_apps      user containers + caddy   (created --internal
#                    by the worker, so members have no route off the
#                    box; Caddy bridges the two)
#
#  A user container is therefore on a network that cannot reach
#  postgres, cannot reach the api, and cannot reach the internet.
# =================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-souqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-souqi}
      POSTGRES_DB: ${POSTGRES_DB:-souqi_deploy}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    # No ports. Nothing outside the platform network talks to the database.
    networks: [platform]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-souqi} -d ${POSTGRES_DB:-souqi_deploy}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------
  #  The database customers' apps actually use. Deliberately a SECOND
  #  cluster, not a second database on the platform one: the platform
  #  cluster holds every project, deployment and encrypted env var on
  #  the box, and no amount of role juggling makes it sane to let
  #  untrusted app code open a socket to it.
  #
  #  NOTE THE NETWORKS LINE. This container is attached to individual
  #  souqi_app_<id> networks at deploy time (see engine.connectUserDb),
  #  exactly as Caddy is — and it is NEVER on souqi_platform, because a
  #  member of both would hand every app container a route to the platform
  #  database and the API.
  #
  #  It sits on souqi_userdb_home, a dead-end network of its own, and the
  #  emphasis is on DEAD END: internal, no gateway, no other member ever.
  #  It would be more honest to say "no networks at all", and two ways of
  #  saying that both fail. `networks: []` is ignored — compose silently
  #  invents a default bridge and puts the container on it, WITH egress,
  #  which is worse than what is written here. `network_mode: none` is a
  #  real answer to a different question: the daemon then refuses every
  #  later `network connect` ("cannot be connected to multiple networks
  #  with one of the networks in private (none) mode"), so the container
  #  could never join an app network and no app could reach its database.
  #
  #  Which raises the obvious question: if the worker sits on platform and
  #  this does not, how does the worker create databases? Over the Docker
  #  socket, not over a network — `docker exec -i` with the SQL on stdin.
  #  The worker already owns the socket and is already the only component
  #  allowed to touch Docker.
  userdb:
    image: postgres:16-alpine
    container_name: souqi-userdb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USERDB_SUPERUSER:-souqiadmin}
      POSTGRES_PASSWORD: ${USERDB_PASSWORD:-}
      POSTGRES_DB: postgres
    volumes:
      - userdbdata:/var/lib/postgresql/data
      # Runs once on an empty data directory: locks down the maintenance
      # databases so a tenant role cannot connect to one and work from there.
      - ./db/userdb-init.sql:/docker-entrypoint-initdb.d/01-lockdown.sql:ro
    # No ports. One network, and it goes nowhere — see above.
    networks: [userdbhome]
    labels:
      # A distinct role label: the janitor sweeps anything managed that is
      # not named app-<deployment_id>, and would otherwise classify this as
      # an orphan every fifteen minutes.
      souqi.managed: "true"
      souqi.role: "userdb"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USERDB_SUPERUSER:-souqiadmin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    # Pinned, for the same reason souqi-userdb is: the worker attaches this
    # container to every per-app network by NAME, over the Docker socket.
    # Without it Compose derives the name from the project directory —
    # "deploy-caddy-1" in the repo, "stack-caddy-1" once ship.sh copies the
    # stack to /opt/platform/stack — so the name the worker was configured
    # with was right in development and wrong on every real host. The
    # network connect failed, Caddy never joined the app network, and every
    # deployed app answered 502 while looking perfectly healthy: container
    # Up, deployment RUNNING, route installed, nothing to see in any log.
    container_name: souqi-caddy
    restart: unless-stopped
    # The only published ports in the entire stack. Application ports are
    # never published — that is what forces all traffic through the proxy.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data          # certificates; losing this re-issues them
      - caddy_config:/config
      # A minimal bootstrap config so Caddy comes up with its admin API
      # reachable. The API replaces this wholesale at startup via /load,
      # which is also what installs the on-demand TLS ask endpoint.
      - ./caddy/caddy.json:/config/caddy.json:ro
    environment:
      # Admin API on the platform network only. Anyone who reaches it can
      # route any hostname anywhere, so it must never be published.
      #
      # It is bound to THIS address and not 0.0.0.0 for a reason that is easy
      # to get wrong: Caddy is a member of the app networks too (it has to be,
      # to proxy to the containers), so a 0.0.0.0 bind puts the admin API on
      # an interface every untrusted user container can reach. Binding the
      # platform address means the socket does not exist on those networks.
      CADDY_ADMIN: "${CADDY_ADMIN_IP:-10.89.0.10}:2019"
    networks:
      platform:
        ipv4_address: ${CADDY_ADMIN_IP:-10.89.0.10}
      apps: {}
    # JSON is Caddy's native config format, so there is no "json" adapter to
    # name here — passing --adapter json makes Caddy exit before it binds.
    command: ["caddy", "run", "--config", "/config/caddy.json", "--resume"]
    healthcheck:
      # Follows the admin bind above — localhost no longer has a listener.
      test: ["CMD-SHELL", "wget --spider -q http://${CADDY_ADMIN_IP:-10.89.0.10}:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build: { context: ., dockerfile: Dockerfile.node }
    restart: unless-stopped
    command: ["node", "src/api/server.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-souqi}:${POSTGRES_PASSWORD:-souqi}@postgres:5432/${POSTGRES_DB:-souqi_deploy}
      CADDY_ADMIN: http://caddy:2019
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      # The control-plane hostname and the secret that guards it. Only the
      # api gets these — the worker serves no external request, so handing
      # it the token would widen the blast radius of a worker compromise
      # for nothing.
      CONTROL_DOMAIN: ${CONTROL_DOMAIN:-}
      DEPLOY_PLATFORM_TOKEN: ${DEPLOY_PLATFORM_TOKEN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      BUILD_ROOT: /opt/platform/builds
      SECRET_KEY: ${SECRET_KEY:-}
      API_PORT: "4500"
      HOST_ID: ${HOST_ID:-local}
      # Sessions. JWT_SECRET must match the main app or every session is
      # rejected; the api refuses to start in production without it.
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_INTROSPECT_URL: ${AUTH_INTROSPECT_URL:-}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-0}
      NODE_ENV: ${NODE_ENV:-development}
      # Where source archives live. Unset = archives stay on this VM only,
      # which the spec warns against and preflight flags.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      # Must reach BOTH services. If the api and the worker disagree about
      # where an archive went, a restore looks in the wrong store and a
      # deployment that was archived perfectly well cannot be rebuilt.
      SOURCE_STORE: ${SOURCE_STORE:-auto}
      SOURCE_ARCHIVE_MAX_BYTES: ${SOURCE_ARCHIVE_MAX_BYTES:-}
    volumes:
      # Shared with the worker so an upload lands where the build reads it.
      - builds:/opt/platform/builds
    # NO docker socket. The api must never be able to run a container.
    networks: [platform]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: Dockerfile.node }
    restart: unless-stopped
    command: ["node", "src/worker/index.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-souqi}:${POSTGRES_PASSWORD:-souqi}@postgres:5432/${POSTGRES_DB:-souqi_deploy}
      CADDY_ADMIN: http://caddy:2019
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      BUILD_ROOT: /opt/platform/builds
      SECRET_KEY: ${SECRET_KEY:-}
      HOST_ID: ${HOST_ID:-local}
      # Authenticates the worker's internal read API, which the api calls for
      # anything that needs the Docker socket (runtime logs). Must match the
      # api's value or every such read is refused.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      WORKER_PORT: "4600"
      # The customer data cluster. The worker reaches it over the Docker
      # socket (`docker exec`), never over a network, so it needs the
      # container's name and its superuser — not a connection string.
      USERDB_CONTAINER: ${USERDB_CONTAINER:-souqi-userdb}
      USERDB_SUPERUSER: ${USERDB_SUPERUSER:-souqiadmin}
      DEFAULT_CPU: ${DEFAULT_CPU:-0.5}
      DEFAULT_MEMORY_MB: ${DEFAULT_MEMORY_MB:-512}
      DEFAULT_PIDS: ${DEFAULT_PIDS:-100}
      MAX_CONTAINERS: ${MAX_CONTAINERS:-40}
      # The worker restores source from here when the build directory is
      # gone, and removes the archive when a deployment is deleted.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      # Must reach BOTH services. If the api and the worker disagree about
      # where an archive went, a restore looks in the wrong store and a
      # deployment that was archived perfectly well cannot be rebuilt.
      SOURCE_STORE: ${SOURCE_STORE:-auto}
      SOURCE_ARCHIVE_MAX_BYTES: ${SOURCE_ARCHIVE_MAX_BYTES:-}
    volumes:
      - builds:/opt/platform/builds
      # THE trust boundary of this whole system.
      #
      # The worker holds the Docker socket because building and running
      # containers IS its job — this is a control plane, and a control plane
      # needs the control API. The socket is root-equivalent on the host, so:
      #
      #   - it is mounted HERE and nowhere else;
      #   - no user container ever receives it (see docker/engine.js runApp,
      #     which has no parameter that could add a mount);
      #   - the worker runs no user-supplied code itself — user build steps
      #     execute inside the build container, never in this process.
      #
      # If you take one rule from this file: never add this line to a
      # service that executes untrusted input.
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [platform]
    depends_on:
      postgres: { condition: service_healthy }
      caddy: { condition: service_started }

networks:
  platform:
    name: souqi_platform
    # Fixed subnet so Caddy can hold a known address to bind its admin API to.
    # If it collides with something on the host, set PLATFORM_SUBNET and
    # CADDY_ADMIN_IP in .env — preflight checks that they agree with
    # caddy/caddy.json, which cannot read environment variables.
    ipam:
      config:
        - subnet: ${PLATFORM_SUBNET:-10.89.0.0/24}
  userdbhome:
    name: souqi_userdb_home
    # A network with exactly one member, and no way off it. It exists only
    # because a container must be on something at boot; every network that
    # matters is attached later, one per app. internal:true means no
    # gateway, so the customer data cluster has no route to the internet
    # even while it is doing nothing.
    internal: true
  apps:
    name: souqi_apps
    # Created here so Caddy can join it at boot; the worker also ensures it
    # exists, because the worker may start against a host where compose has
    # not run. internal:true is what denies user containers any route off
    # the box.
    internal: true

volumes:
  pgdata:
  userdbdata:      # customer data — the one volume here that holds their work
  builds:
  caddy_data:
  caddy_config:
